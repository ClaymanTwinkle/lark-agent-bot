# =============================================================================
# Project: Using Pi / 项目：使用 Pi (uncomment to enable / 取消注释以启用)
# =============================================================================
# Requires: npm install -g @mariozechner/pi-coding-agent
# 需要安装：npm install -g @mariozechner/pi-coding-agent
# Pi is an AI coding agent that speaks two protocols to lark-agent-bot:
# Pi 是 AI 编程 agent，通过两种协议与 lark-agent-bot 通信：
#
#   - "json" mode (default): one-shot `pi --mode json` per turn. No UI
#     forwarding — any tool call that needs permission is silently
#     rejected. Use this only if you never need to ask the user anything.
#     "json" 模式（默认）：每个回合跑一次 `pi --mode json` 进程。
#     不转发 UI 交互——任何需要权限的工具调用都会被静默拒绝。
#     仅在你不需要问用户任何东西时使用。
#
#   - "rpc" mode: persistent `pi --mode rpc` process talking JSONL over
#     stdin/stdout. The engine intercepts Pi's extension_ui_request events
#     and surfaces them as permission / question cards on the messaging
#     platform. The user's decision is piped back to Pi via
#     extension_ui_response. **This is the mode you want.**
#     "rpc" 模式：常驻 `pi --mode rpc` 进程，通过 stdin/stdout 走 JSONL
#     协议。引擎会截获 Pi 的 extension_ui_request 事件，并在消息平台上
#     渲染为权限 / 询问卡片。用户的决策通过 extension_ui_response 回写到
#     Pi。**这是你想要的模式。**
#
# Pi extensions that need user interaction must use the standard UI methods
# (ctx.ui.confirm, ctx.ui.select, ctx.ui.input) so lark-agent-bot can intercept
# them. If you write your own extensions, do NOT roll custom stdin prompts —
# they will be invisible to lark-agent-bot and silently dropped.
# 需要与用户交互的 Pi 扩展必须使用标准 UI 方法（ctx.ui.confirm、
# ctx.ui.select、ctx.ui.input），lark-agent-bot 才能截获。如果你自己写
# 扩展，不要自己往 stdin 里塞 prompt——lark-agent-bot 看不到，会被静默丢弃。
#
# Configuration options:
# - rpc = true|false: enable RPC mode (default: false)
# - mode = "default"|"yolo": permission behavior
# - thinking = "off"|"minimal"|"low"|"medium"|"high"|"xhigh"
# - model = "provider/model" (optional; falls back to settings.json)

# [[projects]]
# name = "my-pi-project"
#
# [projects.agent]
# type = "pi"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# rpc = true                  # enable RPC mode for UI forwarding / 启用 RPC 模式以转发 UI
# mode = "default"            # "default" | "yolo"
# thinking = "high"           # optional / 可选
# # model = "anthropic/claude-sonnet-4-20250514"  # optional / 可选
#
# [[projects.platforms]]
# type = "feishu"
#
# [projects.platforms.options]
# app_id = "your-feishu-app-id"
# app_secret = "your-feishu-app-secret"

# =============================================================================
# Project: Devin CLI (Cognition, https://cli.devin.ai/) / 使用 Devin CLI
# =============================================================================
# Devin speaks the Agent Client Protocol (ACP) over stdio via its `devin acp`
# subcommand. lark-agent-bot ships a first-class `type = "devin"` agent that pins
# the command / args / display name so you don't have to.
# Devin 通过 `devin acp` 子命令使用 ACP 协议与 lark-agent-bot 通信。lark-agent-bot 内置
# `type = "devin"` 的一级支持：无需手动指定 command/args，默认值就能跑通。
#
# Prerequisites / 前置条件:
#   1. Install Devin CLI per the official docs at https://cli.devin.ai/
#      安装 Devin CLI，见官方文档 https://cli.devin.ai/
#   2. Run `devin auth login` once — credentials are stored locally and the
#      ACP subprocess reads them automatically. lark-agent-bot never sees the token.
#      运行一次 `devin auth login` 完成登录；ACP 子进程会自动读取本地凭证，
#      lark-agent-bot 全程不接触 token。
#   3. Windsurf Enterprise users can alternatively inject WINDSURF_API_KEY
#      via the agent env option (see below).
#      Windsurf 企业版用户也可以通过下面的 env 注入 WINDSURF_API_KEY。

# [[projects]]
# name = "my-devin-project"
#
# [projects.agent]
# type = "devin"
#
# [projects.agent.options]
# work_dir = "/path/to/your/code"
# # Optional: override only if the `devin` binary is at a non-standard path.
# # Always use an absolute path when running under launchd / systemd where
# # $PATH is minimal (e.g. ~/.local/bin may not be included).
# # cmd = "/Users/me/.local/bin/devin"
# #
# # Optional: initial permission mode applied to new sessions via
# # session/set_mode. Valid ids: normal, ask, plan, accept-edits, bypass.
# # 可选：新会话的初始权限模式。合法值：normal / ask / plan / accept-edits / bypass
# # mode = "normal"
# #
# # Optional: Windsurf Enterprise API key (overrides `devin auth login`).
# # 可选：Windsurf 企业版 API Key（优先级高于 `devin auth login` 的本地凭证）。
# # [projects.agent.options.env]
# # WINDSURF_API_KEY = "wk_xxx"

# [[projects.platforms]]
# type = "feishu"
#
# [projects.platforms.options]
# app_id = "your-feishu-app-id"
# app_secret = "your-feishu-app-secret"

# =============================================================================
# Project: ACP (Agent Client Protocol) agent / 使用 ACP 子进程
# =============================================================================
# Runs any binary that speaks ACP over stdio (newline-delimited JSON-RPC 2.0).
# See: https://agentclientprotocol.com/
# 启动符合 ACP 的 Agent 进程，通过标准输入输出进行 JSON-RPC 通信。
# Same agent type works for Cursor Agent CLI, OpenClaw bridge, GitHub Copilot CLI, etc.:
# set command + args to match each tool's documented ACP entrypoint.
# 同一 type=acp：通过 command/args 指向各工具文档中的 ACP 启动方式即可。
# For Devin specifically, prefer the dedicated `type = "devin"` section above.
# 针对 Devin 建议直接使用上面的 type = "devin"；下面的 type = "acp" 主要给其他
# 通用 ACP 工具使用。

# --- Example: Cursor Agent CLI (npm: @anthropic-ai/cursor-agent) ---
# [[projects]]
# name = "cursor-acp"
#
# [projects.agent]
# type = "acp"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# cmd = "agent"
# args = ["acp"]
# auth_method = "cursor_login"
# display_name = "Cursor ACP"

# --- Example: OpenClaw (Gateway-backed ACP bridge) ---
# Docs: https://docs.openclaw.ai/cli/acp
# Install the OpenClaw CLI, run a Gateway, then point lark-agent-bot at `openclaw acp`.
#
# IMPORTANT: Remote OpenClaw requires pairing authorization before use!
#
# For remote gateways, you MUST complete the pairing process:
#   1. Start OpenClaw gateway: openclaw acp --url wss://your-gateway:18789
#   2. In another terminal, run: openclaw pair
#   3. Approve the pairing request in the OpenClaw UI
#   4. Now lark-agent-bot can communicate with the authorized gateway
#
# Without pairing, OpenClaw will return empty responses ("pairing required" error).
# Reference: https://zhuanlan.zhihu.com/p/2005687480976970296
#
# [[projects]]
# name = "openclaw-acp"
#
# [projects.agent]
# type = "acp"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# cmd = "openclaw"
# args = ["acp"]
# # Remote gateway (use token-file on shared hosts — avoid --token in argv):
# # args = ["acp", "--url", "wss://gateway-host:18789", "--token-file", "/path/to/gateway.token"]
# # Optional: bind to an existing session key
# # args = ["acp", "--session", "agent:main:main"]
# display_name = "OpenClaw ACP"
# # env = { OPENCLAW_GATEWAY_TOKEN = "..." }

# --- Example: Trae CLI ACP (https://www.trae.ai/) ---
# [[projects]]
# name = "trae-acp"
#
# [projects.agent]
# type = "acp"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# cmd = "traecli"
# args = ["acp", "serve"]
# display_name = "Trae CLI ACP"

# --- Example: COCO ACP ---
# [[projects]]
# name = "coco-acp"
#
# [projects.agent]
# type = "acp"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# cmd = "coco"
# args = ["acp", "serve"]
# display_name = "COCO ACP"

# --- Example: GitHub Copilot CLI (public preview) ---
# Docs: https://docs.github.com/en/copilot/reference/copilot-cli-reference/acp-server
# Requires Copilot CLI installed and authenticated; no auth_method for ACP subprocess.
# [[projects]]
# name = "copilot-acp"
#
# [projects.agent]
# type = "acp"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# cmd = "copilot"
# args = ["--acp", "--stdio"]
# display_name = "Copilot ACP"
# # cmd = "/absolute/path/to/copilot"   # if not on PATH (see COPILOT_CLI_PATH in GitHub docs)

# [[projects.platforms]]
# type = "feishu"
#
# [projects.platforms.options]
# app_id = "your-feishu-app-id"
# app_secret = "your-feishu-app-secret"

