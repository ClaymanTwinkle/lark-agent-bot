# lark-agent-bot configuration
# lark-agent-bot 配置文件
#
# Copy this file to config.toml and fill in your credentials.
# 复制此文件为 config.toml，填入你的凭证信息。
#
# String values support ${VAR_NAME} environment variable substitution.
# Example: app_secret = "${FEISHU_APP_SECRET}" / 所有字符串值都支持 ${VAR_NAME} 环境变量替换。
# 例如：app_secret = "${FEISHU_APP_SECRET}"
#
# Each [[projects]] entry binds one code directory to its own agent + platforms.
# A single lark-agent-bot process can manage multiple projects simultaneously.
# 每个 [[projects]] 将一个代码目录绑定到独立的 agent 和平台。
# 单个 lark-agent-bot 进程可以同时管理多个项目。

# =============================================================================
# Global Settings / 全局设置
# =============================================================================

# Language for bot messages / 机器人消息语言
# - "en": English
# - "zh": 中文
# - "" (empty/not set): Auto-detect from user's first message / 留空自动检测
# language = "en"

# Shell for /shell commands, cron exec, hooks, and webhook exec.
# /shell 命令、cron exec、hooks 和 webhook exec 使用的 shell。
# Default / 默认: "sh" (Unix) or "powershell.exe" (Windows)
# Supported / 支持: sh, bash, zsh, fish, cmd, powershell, pwsh
# shell = "/bin/zsh"

# Init command prepended to every shell command. Useful for sourcing profiles
# so user-defined functions and aliases are available.
# 初始化命令，会添加到每条 shell 命令前面。用于加载 profile，使自定义函数和别名可用。
# shell_profile = "source ~/.zshrc"

# Session data storage directory (default: ~/.lark-agent-bot)
# Stores conversation history and session state as JSON files.
# 会话数据存储目录（默认 ~/.lark-agent-bot），以 JSON 文件保存对话历史和会话状态。
# data_dir = "/path/to/custom/dir"

# Attachment send-back switch for `lark-agent-bot send --image/--file`.
# Independent from the agent's /mode. Set to "off" to block IM image/file send-back.
# `lark-agent-bot send --message` without attachments is unaffected.
# 附件回传开关，用于控制 `lark-agent-bot send --image/--file`。
# 它与 agent 的 /mode 独立；设为 "off" 会禁用通过 IM 回传图片/文件。
# 不带附件的 `lark-agent-bot send --message` 不受影响。
# attachment_send = "on"

# Maximum size of a single attachment (in MiB) for `lark-agent-bot send
# --file/--image/--audio/--video` and the /send API. Default: 50 (i.e. 50 MiB).
# Set 0 to keep the default. Raise it to send larger files; the /send request
# body limit scales with this value to fit base64-encoded attachments.
# Can also be overridden by the CC_MAX_ATTACHMENT_SIZE_MB env var (same MiB
# unit; takes precedence over this option when set).
# `lark-agent-bot send` 单个附件的最大大小（单位 MiB）。默认 50（即 50 MiB），设 0 保持默认。
# 调大可发送更大文件；/send 请求体上限会随之按 base64 膨胀自动放大。
# 也可用环境变量 CC_MAX_ATTACHMENT_SIZE_MB 覆盖（同样单位 MiB；设置后优先级高于本配置项）。
# max_attachment_size_mb = 50

# Stale busy-lock self-heal threshold (minutes). When a message arrives, the
# session is busy, the agent process is dead, and the lock has been held longer
# than this, lark-agent-bot dumps goroutine stacks to the OS temp dir, breaks the
# lock, and processes the message in a fresh turn. Live agents are never
# touched (process-alive gate), so long-running turns are safe at any value.
# Default: 2 (just above the 120s graceful-stop wait). 0 disables the breaker.
# 会话忙锁自愈阈值（分钟）。消息到达时会话忙、agent 进程已死、且锁持有超过该时长时，
# lark-agent-bot 会把 goroutine 栈转储到系统临时目录、破锁并在新 turn 中处理该消息。
# 存活的长任务永远不会被触碰（进程存活门控），任何取值都安全。
# 默认 2（略高于 120 秒优雅停止等待）。设 0 关闭该自愈。
# busy_timeout_mins = 2

[log]
level = "info" # debug, info, warn, error

# =============================================================================
