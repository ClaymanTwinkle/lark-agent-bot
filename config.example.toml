# =============================================================================
# Project 4: Using Codex agent / 项目 4：使用 Codex agent (uncomment to enable / 取消注释以启用)
# =============================================================================
# Requires: npm install -g @openai/codex
# 需要安装：npm install -g @openai/codex
# Codex uses app-server by default, including approval requests and automatic review.
# Codex 默认使用 app-server，支持权限审批与自动审核。

# [[projects]]
# name = "my-codex-project"
#
# [projects.agent]
# type = "codex"
#
# [projects.agent.options]
# work_dir = "/path/to/project"
# backend = "app_server"  # Default / 默认
# mode = "default"  # "default" | "auto-review" | "read-only" | "full-access"
#
# Mode options / 模式说明:
# - "default": workspace sandbox, user reviews additional access / 工作区沙箱，额外权限由用户审批
# - "auto-review": workspace sandbox, automatically approve or deny permission requests / 工作区沙箱，自动审核权限请求
# - "read-only": read-only sandbox, user reviews additional access / 只读沙箱，额外权限由用户审批
# - "full-access": no sandbox or approval prompts / 完全访问权限，不受沙箱限制，不请求审批
# Modes set sandbox, approval policy and reviewer together; no approvals_reviewer override.
# 模式同时决定沙箱、审批策略和审核者，不再支持独立的 approvals_reviewer 配置。
# Removed modes (suggest, auto-edit, full-auto, yolo and aliases) are rejected.
# 旧模式名（suggest、auto-edit、full-auto、yolo 及其别名）会报错，不做兼容转换。
# Optional backend="exec" supports only explicit read-only or full-access.
# exec cannot request approvals; read-only operations requiring extra access fail.
# 可选 exec 后端仅支持显式设置 read-only 或 full-access；无法申请审批，需要额外权限时直接失败。
#
# Optional: specify a model / 可选：指定模型
# model = "o3"
#
# Optional: specify Codex reasoning effort / 可选：指定 Codex 推理强度
# reasoning_effort = "high"  # "none" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max" | "ultra"
#
# Optional: project system prompt / 可选：项目系统提示
# Codex has no native system-prompt flag, so lark-agent-bot injects this as a
# preamble prepended to your first message of each new session (resumed
# sessions are not re-injected).
# Codex 没有原生的系统提示参数，lark-agent-bot 会将其作为前导内容注入到每个新
# 会话的第一条消息之前（恢复的会话不会重复注入）。
# system_prompt = "You are a helpful AI assistant that specializes in Python development."
#
# Optional: additional project instructions / 可选：追加的项目指令
# Appended after system_prompt in the same injected preamble. Can be used
# alone or combined with system_prompt.
# 追加在 system_prompt 之后，包含在同一段注入的前导内容中。可单独使用，也可与
# system_prompt 同时使用。
# append_system_prompt = "Always respond in Chinese and prefer concise answers."
#
# # Active provider / 当前激活的 provider
# # provider = "openai"
#
