name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (changed code only)
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          LINT_BIN="$(go env GOPATH)/bin/golangci-lint"

          run_lint() {
            "$LINT_BIN" run "$@" || {
              code=$?
              # exit code 5 = "no go files to analyze" — not a lint failure
              [ "$code" -eq 5 ] && return 0
              return "$code"
            }
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            run_lint --new-from-rev "origin/${{ github.base_ref }}" ./...
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            run_lint --new-from-rev "${{ github.event.before }}" ./...
          else
            echo "No base revision to diff against; skipping incremental lint."
          fi

      - name: Lint GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          "$(go env GOPATH)/bin/actionlint" -color

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Release workflow regression tests
        run: node --test tests/workflows/*.test.cjs

      - name: Smoke tests
        run: go test -tags=smoke,no_web ./tests/e2e/...

      - name: Regression tests
        run: go test -tags=regression,no_web ./tests/e2e/...

  cross-build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build (${{ matrix.goos }})
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: '0'
        run: go build -tags no_web ./cmd/lark-agent-bot
