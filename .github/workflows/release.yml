name: Release

# Push a tag like v0.1.0 (or v0.2.0-beta.1 for a pre-release) to publish:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces lark-agent-bot-<tag>-<os>-<arch>.tar.gz|.zip plus checksums.txt on
# the GitHub Release. These names are what `lark-agent-bot update`, the
# /upgrade chat command, and the npm installer download, so keep them in sync
# with the Makefile `release-all` target.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '$TAG' is not a semver tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: make release-all VERSION="$TAG"

      # --generate-notes lists merged pull requests, and changes land on main
      # without them, so the notes were only a compare link. /upgrade shows
      # these notes before updating.
      - name: Write release notes
        run: |
          exclude=()
          if [[ "$TAG" != *-* ]]; then
            # A release is compared with the previous release, not a beta.
            exclude=(--exclude '*-*')
          fi
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${exclude[@]}" "$TAG^" 2>/dev/null || true)"
          range="$TAG"
          if [ -n "$prev" ]; then
            range="$prev..$TAG"
          fi
          # section TITLE PATTERN [-v]: commit subjects matching (or with -v,
          # not matching) PATTERN, without their "type:" prefix.
          section() {
            local lines grep_args=(-E)
            if [ "${3:-}" = -v ]; then
              grep_args+=(-v)
            fi
            lines="$(git log --no-merges --format='%s (%h)' "$range" \
              | grep "${grep_args[@]}" "$2" \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^/- /' || true)"
            if [ -n "$lines" ]; then
              printf '## %s\n\n%s\n\n' "$1" "$lines"
            fi
          }
          {
            section 'Features' '^feat(\(|!|:)'
            section 'Fixes' '^fix(\(|!|:)'
            section 'Other changes' '^(feat|fix)(\(|!|:)' -v
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              "${prerelease[@]}"
          fi

  npm:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node supplies this placeholder when no token is configured.
          if [ -z "$NODE_AUTH_TOKEN" ] || [ "$NODE_AUTH_TOKEN" = 'XXXXX-XXXXX-XXXXX-XXXXX' ]; then
            echo "::notice::NPM_TOKEN secret is not set; skipping npm publish."
            exit 0
          fi
          version="${TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            dist_tag=beta
          fi
          if npm view "lark-agent-bot@$version" version >/dev/null 2>&1; then
            echo "lark-agent-bot@$version is already on npm; skipping."
            exit 0
          fi
          npm publish --access public --provenance --tag "$dist_tag"
